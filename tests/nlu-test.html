 check('US22 for every course, only teachers of that course are shown',()=>{for(const c of Object.keys(COURSE_T)){const a=run('who teaches '+c).said;
   const bad=kbKind('teacher').find(e=>{const d=kbData(e);return d.x.courses.includes(c)!==has(a,d.q.en[0])});if(bad)return c+': '+kbData(bad).q.en[0]}return true}),
 check('US22 the directory: 8–10 teachers, emails @university.demo, offices are teacher offices of the map, every demo student course and INF451 (2 teachers) covered',()=>{const t=kbKind('teacher').map(e=>kbData(e).x);
   return t.length>=8&&t.length<=10&&t.every(x=>/^[a-z.]+@university\.demo$/.test(x.mail)&&CAMPUS.get(x.room).t==='office'&&!Object.values(OFFICE_INFO).some(o=>o.room===x.room)&&x.oh.length)&&
     Object.keys(COURSE_T).every(c=>t.some(x=>x.courses.includes(c)))&&t.filter(x=>x.courses.includes('INF451')).length===2}),
 check('US22 visitor: office hours by course code work without signing in',()=>{const a=run('When are office hours for INF451?','visitor').said;return has(a,'INF451 Team Software Project is taught by 2 teachers')&&has(a,'E206')||a}),
 check('US22 "консультация" alone stays an advisor question',()=>run('консультация').r.i==='adv'),
 check('QA 7: no phone number in any events, clubs or teacher answer (all roles)',()=>{at(2026,11,23,11);const qs=['What events are on campus this week?','upcoming events','When is the hackathon?','Is there a programming club?','what student clubs are there',
     'When are office hours for my INF451 teacher?','email of my teacher','What is the email of professor Ivanov?','who teaches CS999','почта преподавателя Иванова','консультация қашан','осы аптадағы іс-шаралар','Is Dr. Lumen the INF451 teacher?'];
   for(const who of ['249900002','249900001','visitor','staff'])for(const q of qs){const a=run(q,who).said;if(/\+?\d[\d ()-]{6,}\d/.test(a)||/phone|телефон/i.test(a))return who+': '+q+' → '+a.slice(0,200)}
   return !OFFICE_INFO.deans.tel&&kbKind('teacher').concat(kbKind('event'),kbKind('club')).every(e=>{const d=kbData(e);return !/\+?\d[\d ()-]{6,}\d/.test(JSON.stringify([d.q,d.a,d.x]))})}),
 check('US17 every student has different GPA and credits; INF451 not posted for all',()=>{const v=Object.values(ACAD);return new Set(v.map(a=>a.gpa)).size===v.length&&new Set(v.map(a=>a.cr)).size===v.length&&v.every(a=>a.courses.some(c=>c.c==='INF451'&&c.g===null))}),
];
window.clock=()=>new Date();
function table(rows){return '<table><thead><tr><th>#</th><th>Question</th><th>Expected</th><th>Bot routed to</th><th>Bot answered</th><th>Result</th></tr></thead><tbody>'+
  rows.map((x,i)=>'<tr class="'+(x.ok?'':'fail')+'"><td>'+(i+1)+'</td><td>'+esc(x.q)+(x.who?' <small>('+x.who+')</small>':'')+'</td><td><code>'+esc(x.exp)+'</code></td><td><code>'+esc(x.got)+'</code></td><td>'+esc(x.said.slice(0,110))+'</td><td class="'+(x.ok?'ok':'bad')+'">'+(x.ok?'✓':'✗')+'</td></tr>').join('')+'</tbody></table>'}
const res=CASES.map(([q,exp,who])=>{const {r,said}=run(q,who),got=label(r);return{q,exp,who,got,said,ok:got===exp}});

/* regression: every question variant of the built-in knowledge base and the old quick questions must still reach their answer */
const reg=[];
kbLive().filter(e=>e.id!=='summer').forEach(e=>{const d=kbData(e);LANGS.forEach(l=>d.q[l].forEach(q=>reg.push([q,e.intent||e.id])))});
[['Can I register for my courses?','reg'],['What is my tuition balance?','bill'],['Book an advisor meeting','adv'],['I forgot my password','pw'],
 ['When is the add/drop deadline?','adddrop'],['Talk to a person','human'],['Where is room F305?','campus'],['Где кабинет D104?','campus'],
 ['Where is the library?','campus'],['Create a ticket','ticket'],['Где моё расписание?','sched'],['Wi-Fi не подключается','wifi']].forEach(x=>reg.push(x));
const rres=reg.map(([q,exp])=>{const {r,said}=run(q),got=label(r);return{q,exp,got,said,ok:got===exp}});

const oldres=[];Object.entries(OLD).forEach(([exp,ws])=>ws.forEach(q=>{const {r,said}=run(q),got=label(r);oldres.push({q,exp,got,said,ok:got===exp})}));
WEAK.forEach(([q,exp])=>{const {r,said}=run(q),got=label(r);oldres.push({q,exp,got,said,ok:got===exp})});
const langres=LANGT.map(([q,exp])=>{const got=detect(q);return{q,exp,got,said:'',ok:got===exp}});
const pct=a=>Math.round(100*a.filter(x=>x.ok).length/a.length);
document.getElementById('out').innerHTML=
  '<p class="sum" id="sum">Test set: '+res.filter(x=>x.ok).length+' / '+res.length+' ('+pct(res)+'%) · Regression: '+rrex(rres)+' · Old rule words: '+rrex(oldres)+' · Language: '+rrex(langres)+' · QA checks: '+rrex(QA)+'</p>'+
  '<h2>Test set: slang, transliteration, typos (EN / RU / KK)</h2>'+table(res)+
  '<h2>Regression: built-in questions and quick questions</h2>'+table(rres)+
  '<h2>Every word of the old keyword rules</h2>'+table(oldres)+
  '<h2>Language of the question</h2>'+table(langres)+
  '<h2>QA scenarios from docs/SPRINTS.md</h2>'+table(QA);
function rrex(a){return a.filter(x=>x.ok).length+' / '+a.length+' ('+pct(a)+'%)'}
</script>
