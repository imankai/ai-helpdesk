 check('US18 no warning while more than 2 are left (249900004, MAT301 2 of 5 → 3)',()=>{st.att=seedAtt();st.notes=[];return attCheck('249900004')===0}),
 check('US18 a mark for one student does not change another student',()=>{st.att=seedAtt();st.notes=[];markAbsence('249900002','INF451');return st.att['249900001'].INF451===2&&!st.notes.some(n=>n.uid!=='249900002')}),
 check('US18 a student sees only own absences (249900001: INF451 2 of 6)',()=>{st.att=seedAtt();U=ACCOUNTS['249900001'];said=[];curQ='How many classes have I missed in INF451?';respond(route(curQ),'en',curQ);const a=said.join();return has(a,'2 of 6')&&!has(a,'4 of 6')||a}),
 check('US18 visitor is asked to sign in, no absences shown',()=>{const a=run('How many classes have I missed in INF451?','visitor').said;return has(a,'sign in')&&!has(a,'of 6')||a}),
 check('US18 every student has INF451 with limit 6; one has 4 absences',()=>Object.keys(ATT_SEED).every(k=>attList(k).some(x=>x.c==='INF451'&&x.lim===6))&&Object.values(ATT_SEED).filter(m=>m.INF451===4).length===1),
 check('US19 S1 "Is ‘Clean Code’ available in the library?" → copies available and shelf, as in the catalog',()=>{const b=CATALOG.find(x=>x.t==='Clean Code'),a=run("Is 'Clean Code' available in the library?").said;return has(a,b.av+' of '+b.n+' copies available')&&has(a,'Shelf '+b.sh)&&has(a,'Robert C. Martin')||a}),
 check('US19 S1 Russian: "есть ли книга Clean Code" → Доступно 2 из 4, Полка B-12',()=>{const a=run('есть ли книга Clean Code').said;return has(a,'Доступно 2 из 4')&&has(a,'Полка B-12')||a}),
 check('US19 all copies on loan → "Not available" and the nearest return date',()=>{const a=run('Is The Pragmatic Programmer available?').said;return has(a,'Not available')&&has(a,'18.11.2026')&&!has(a,'copies available')||a}),
 check('US19 search by course: INF451 → its three books',()=>{const a=run('books for INF451').said;return has(a,'Clean Code')&&has(a,'The Pragmatic Programmer')&&has(a,'Refactoring')&&!has(a,'Statistics')||a}),
 check('US19 search by author and with a typo',()=>{const a=run('books by Sommerville').said,b=run('is clen code available').said;return has(a,'Software Engineering')&&has(b,'Clean Code')||a+' / '+b}),
 check('US19 a book not in the catalog',()=>{const a=run('is Harry Potter available in the library').said;return has(a,'couldn’t find “harry potter”')||has(a,"couldn't find “harry potter”")||a}),
 check('US19 "Where is the library?" still says it is not on the map (no invented location)',()=>{const r=run('Where is the library?').r;return r.k==='campus'&&r.c.k==='svc'}),
 check('US19 S2 "When do I need to return my books?" (249900001) → both books with due dates, overdue marked, hold explained',()=>{at(2026,11,13,10);const a=run('When do I need to return my books?','249900001').said;
   return has(a,'Clean Code — return by 25.11.2026')&&has(a,'Operating System Concepts — was due 30.10.2026 · Overdue by 14 days')&&has(a,'blocks your course registration')||a}),
 check('US19 S2 Kazakh: overdue marked "мерзімі өтіп кетті"',()=>{at(2026,11,13,10);const a=run('кітапты қашан қайтару керек','249900001').said;return has(a,'өтіп кетті')&&has(a,'25.11.2026')||a}),
 check('US19 each student sees only own books (249900002 → Computer Networking only)',()=>{at(2026,11,13,10);const a=run('my books').said;return has(a,'Computer Networking')&&!has(a,'Clean Code')&&!has(a,'Overdue')||a}),
 check('US19 a student with no loans',()=>{const a=run('my books','249900003').said;return has(a,'no library books')||a}),
 check('US19 visitor can search the catalog but "my books" asks to sign in',()=>{const a=run('Is Clean Code available?','visitor').said,b=run('my books','visitor').said;return has(a,'2 of 4')&&has(b,'sign in')&&!has(b,'return by')||a+' / '+b}),
 check('US19 staff in Test assistant: catalog and own loans',()=>{at(2026,11,13,10);const a=run('my books','staff').said,b=run('Is Clean Code available?','staff').said;return has(a,'Software Engineering — return by 27.11.2026')&&!has(a,'Clean Code')&&has(b,'2 of 4')||a+' / '+b}),
 check('US19 catalog has 12–15 books incl. Clean Code; available never above total',()=>CATALOG.length>=12&&CATALOG.length<=15&&CATALOG.some(b=>b.t==='Clean Code')&&CATALOG.every(b=>b.av<=b.n&&(b.av||b.next))),
 check('US20 S1 "The light in my room does not work" (249900001) → repair, Dormitory 1, room 312, then a request number',()=>{st.housing=seedHousing();st.notes=[];
   const a=run('The light in my room does not work','249900001').said;if(!(has(a,'Type: Repair')&&has(a,'Dormitory: Dormitory 1')&&has(a,'Room: 312')&&lastO.acts[0][0]==='Confirm'))return a;
   said=[];lastO.acts[0][1]();const b=said.join(),h=st.housing[st.housing.length-1];return has(b,'Request H-103 created: Repair · Dormitory 1, room 312')&&h.uid==='249900001'&&h.status==='submitted'||b}),
 check('US20 Russian: "в общаге не работает свет" → Ремонт, Общежитие №1, комната 312',()=>{const a=run('в общаге не работает свет','249900001').said;return has(a,'Тип: Ремонт')&&has(a,'Общежитие №1')&&has(a,'Комната: 312')||a}),
 check('US20 Kazakh: "жатақханада кран сынды" → Жөндеу, 1-жатақхана',()=>{const a=run('жатақханада кран сынды','249900001').said;return has(a,'Түрі: Жөндеу')&&has(a,'1-жатақхана')||a}),
 check('US20 the type is suggested and can be changed (room change)',()=>{const a=run('I want to change my room','249900001').said;return has(a,'Type: Room change')&&lastO.acts.some(x=>x[0]==='Change type: Repair')||a}),
 check('US20 S2 staff sets "in progress" → status and last update; the student is notified',()=>{st.housing=seedHousing();st.notes=[];run('The light in my room does not work','249900001');lastO.acts[0][1]();
   const ok=setHStatus(103,'progress'),nt=st.notes.find(x=>x.uid==='249900001'&&x.type==='hreq'&&x.s==='progress'),a=run('What is the status of my repair request?','249900001').said;
   return ok&&!!nt&&has(a,'Request H-103 (Repair): In progress. Last update: ')&&has(a,new Date().getFullYear()+'')||a}),
 check('US20 S2 Russian: "статус моей заявки по ремонту" → В работе',()=>{const a=run('статус моей заявки по ремонту','249900001').said;return has(a,'Заявка H-103 (Ремонт): В работе')&&has(a,'Последнее обновление')||a}),
 check('US20 statuses go submitted → in progress → done',()=>setHStatus(103,'done')&&st.housing.find(h=>h.n===103).status==='done'&&!setHStatus(103,'done')),
 check('US20 a student without a dormitory (249900002) is refused with the Housing Office contacts',()=>{const k=st.housing.length,a=run('The light in my room does not work').said;
   return has(a,'do not live in a university dormitory')&&has(a,'G206')&&has(a,'000-00-05')&&has(a,'housing@')&&!lastO.acts.some(x=>x[0]==='Confirm')&&st.housing.length===k||a}),
 check('US20 each student sees only own requests (249900003 → H-101, 249900004 → H-102)',()=>{const a=run('repair request status','249900003').said,b=run('repair request status','249900004').said;
   return has(a,'H-101')&&!has(a,'H-103')&&has(b,'H-102')&&!has(b,'H-101')||a+' / '+b}),
 check('US20 visitor: the Housing Office entry, no personal request; status asks to sign in',()=>{const a=run('The light in my room does not work','visitor').said,b=run('What is the status of my repair request?','visitor').said;
   return has(a,'Housing Office')&&!has(a,'Confirm')&&has(b,'sign in')||a+' / '+b}),
 check('US20 three students live in a dormitory, one does not',()=>Object.values(ACCOUNTS).filter(a=>a.role==='student'&&a.dorm).length===3&&Object.values(ACCOUNTS).filter(a=>a.role==='student'&&!a.dorm).length===1),
 check('US17 every student has different GPA and credits; INF451 not posted for all',()=>{const v=Object.values(ACAD);return new Set(v.map(a=>a.gpa)).size===v.length&&new Set(v.map(a=>a.cr)).size===v.length&&v.every(a=>a.courses.some(c=>c.c==='INF451'&&c.g===null))}),
];
window.clock=()=>new Date();
function table(rows){return '<table><thead><tr><th>#</th><th>Question</th><th>Expected</th><th>Bot routed to</th><th>Bot answered</th><th>Result</th></tr></thead><tbody>'+
  rows.map((x,i)=>'<tr class="'+(x.ok?'':'fail')+'"><td>'+(i+1)+'</td><td>'+esc(x.q)+(x.who?' <small>('+x.who+')</small>':'')+'</td><td><code>'+esc(x.exp)+'</code></td><td><code>'+esc(x.got)+'</code></td><td>'+esc(x.said.slice(0,110))+'</td><td class="'+(x.ok?'ok':'bad')+'">'+(x.ok?'✓':'✗')+'</td></tr>').join('')+'</tbody></table>'}
const res=CASES.map(([q,exp,who])=>{const {r,said}=run(q,who),got=label(r);return{q,exp,who,got,said,ok:got===exp}});

/* regression: every question variant of the built-in knowledge base and the old quick questions must still reach their answer */
const reg=[];
kbLive().filter(e=>e.id!=='summer').forEach(e=>{const d=kbData(e);LANGS.forEach(l=>d.q[l].forEach(q=>reg.push([q,e.intent||e.id])))});
[['Can I register for my courses?','reg'],['What is my tuition balance?','bill'],['Book an advisor meeting','adv'],['I forgot my password','pw'],
 ['When is the add/drop deadline?','adddrop'],['Talk to a person','human'],['Where is room F305?','campus'],['Где кабинет D104?','campus'],
 ['Where is the library?','campus'],['Create a ticket','ticket'],['Где моё расписание?','sched'],['Wi-Fi не подключается','wifi']].forEach(x=>reg.push(x));
const rres=reg.map(([q,exp])=>{const {r,said}=run(q),got=label(r);return{q,exp,got,said,ok:got===exp}});

const oldres=[];Object.entries(OLD).forEach(([exp,ws])=>ws.forEach(q=>{const {r,said}=run(q),got=label(r);oldres.push({q,exp,got,said,ok:got===exp})}));
WEAK.forEach(([q,exp])=>{const {r,said}=run(q),got=label(r);oldres.push({q,exp,got,said,ok:got===exp})});
const langres=LANGT.map(([q,exp])=>{const got=detect(q);return{q,exp,got,said:'',ok:got===exp}});
const pct=a=>Math.round(100*a.filter(x=>x.ok).length/a.length);
document.getElementById('out').innerHTML=
  '<p class="sum" id="sum">Test set: '+res.filter(x=>x.ok).length+' / '+res.length+' ('+pct(res)+'%) · Regression: '+rrex(rres)+' · Old rule words: '+rrex(oldres)+' · Language: '+rrex(langres)+' · QA checks: '+rrex(QA)+'</p>'+
  '<h2>Test set: slang, transliteration, typos (EN / RU / KK)</h2>'+table(res)+
  '<h2>Regression: built-in questions and quick questions</h2>'+table(rres)+
  '<h2>Every word of the old keyword rules</h2>'+table(oldres)+
  '<h2>Language of the question</h2>'+table(langres)+
  '<h2>QA scenarios from docs/SPRINTS.md</h2>'+table(QA);
function rrex(a){return a.filter(x=>x.ok).length+' / '+a.length+' ('+pct(a)+'%)'}
</script>
